name: Coverage and Playground Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/write-coverage-badge.mjs'
      - '.github/workflows/coverage-badge.yml'
      - 'playground/**'
      - 'assets/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  coverage-badge:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --workspaces=false

      - name: Run coverage
        shell: bash
        run: |
          set -o pipefail
          npm run coverage | tee coverage-output.txt

      - name: Generate badge payload
        run: npm run coverage:badge

      - name: Install the pinned playground engine
        working-directory: playground
        run: npm ci --ignore-scripts --workspaces=false

      - name: Verify the presets and published engine
        working-directory: playground
        env:
          TZ: UTC
        run: npm test

      - name: Build the playground and preserve coverage.json
        working-directory: playground
        run: npm run build -- --with-coverage

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./playground/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
