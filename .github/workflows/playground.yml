name: RRULE Playground

on:
  workflow_dispatch:
  pull_request:
    paths: ['playground/**', '.github/workflows/playground.yml', '.github/workflows/coverage-badge.yml', '.nvmrc']
  push:
    branches: [main]
    paths: ['playground/**', '.github/workflows/playground.yml', '.github/workflows/coverage-badge.yml', '.nvmrc']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        timezone: [UTC, America/New_York, Pacific/Kiritimati]
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm install --global agent-browser@0.43.0
      - run: agent-browser install --with-deps
      - run: npm run build
      - run: npm run test:browser
